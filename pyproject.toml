[project]
name = "why"
version = "0.3.0"
description = "Daily headline sentiment pipeline: Google News RSS, DuckDB and Parquet, VADER and FinBERT, static site"
readme = "README.md"
requires-python = ">=3.12"
# dependencies live in requirements.txt, requirements-dev.txt and requirements-finbert.txt

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["why", "backend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # vaderSentiment 3.3.2 still calls codecs.open(), deprecated in Python 3.14
    "ignore:codecs.open:DeprecationWarning",
]
