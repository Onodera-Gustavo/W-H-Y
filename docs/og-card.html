<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WHY social card source</title>
  <!--
    Source of frontend/assets/img/og.png (1200x630). Render it with Edge or Chrome headless:
    msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000
           --screenshot=frontend/assets/img/og.png docs/og-card.html
    The strip is illustrative: its meters and lines are fixed shapes, not a real edition.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
  <style>
    :root {
      --paper: #fafaf8;
      --ink: #181816;
      --ink-2: #45443f;
      --ink-3: #66655e;
      --rule: #dedcd3;
      --rule-strong: #b5b3aa;
      --track: #e8e6de;
      --pos: #1f8a66;
      --neg: #cf4a3f;
      --neu: #8a8880;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      --serif: "IBM Plex Serif", Georgia, serif;
    }

    html, body { margin: 0; background: var(--paper); }

    .card {
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      padding: 40px 64px 44px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--mono);
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 11px;
      border-top: 5px double var(--ink);
      border-bottom: 1px solid var(--ink);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .bar span:last-child { font-weight: 400; color: var(--ink-2); letter-spacing: 0.04em; text-transform: none; }

    .hero {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 60px;
    }

    .mark {
      font-weight: 600;
      font-size: 216px;
      line-height: 0.9;
      letter-spacing: 0.08em;
      color: transparent;
      -webkit-text-stroke: 4px var(--ink);
    }

    .sub {
      font-size: 21px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    h1 {
      margin: 16px 0 0;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 44px;
      line-height: 1.14;
      letter-spacing: -0.01em;
    }

    .strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1px;
      background: var(--rule);
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--rule);
    }

    .cell {
      display: grid;
      gap: 12px;
      padding: 16px 18px 14px;
      background: var(--paper);
    }

    .cell b {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .track { fill: var(--track); }
    .mid { stroke: var(--ink-3); stroke-width: 1.5; }
    .pos { fill: var(--pos); }
    .neg { fill: var(--neg); }
    .neu { fill: var(--neu); }
    .zero { stroke: var(--rule-strong); stroke-width: 1.5; }
    .tick { stroke: var(--rule-strong); stroke-width: 1.5; }
    .line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .end { stroke: var(--paper); stroke-width: 3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span>Daily edition &middot; Sentiment by FinBERT and VADER</span>
      <span>onodera-gustavo.github.io/W-H-Y</span>
    </div>

    <div class="hero">
      <div class="mark">WHY</div>
      <div>
        <div class="sub">What Happened Yesterday</div>
        <h1>Yesterday's market headlines by topic, scored for sentiment and checked across two models.</h1>
      </div>
    </div>

    <div class="strip" id="strip"></div>
  </div>

  <script>
    // Illustrative shapes only: [label, meter value, 14 point line]
    const cells = [
      ["Markets", -0.18, [0.05, 0.1, 0.02, -0.04, 0.08, 0.12, 0.06, -0.02, -0.08, -0.03, -0.1, -0.06, -0.12, -0.18]],
      ["Tesla", 0.32, [-0.1, -0.05, 0.02, 0.08, 0.04, 0.12, 0.18, 0.1, 0.16, 0.22, 0.18, 0.26, 0.24, 0.32]],
      ["AI", 0.06, [0.2, 0.16, 0.22, 0.12, 0.14, 0.08, 0.1, 0.04, 0.12, 0.06, 0.02, 0.08, 0.04, 0.06]],
      ["Economy", -0.22, [-0.02, -0.06, 0.02, -0.08, -0.12, -0.06, -0.14, -0.1, -0.18, -0.12, -0.2, -0.16, -0.24, -0.22]],
      ["Tech", 0.4, [0.12, 0.2, 0.16, 0.26, 0.22, 0.3, 0.28, 0.34, 0.3, 0.38, 0.32, 0.36, 0.42, 0.4]],
      ["Energy", 0.12, [-0.12, -0.04, -0.1, 0.02, -0.02, 0.06, 0.0, 0.08, 0.04, 0.1, 0.06, 0.14, 0.08, 0.12]],
    ];
    const tone = (v) => (v >= 0.05 ? "pos" : v <= -0.05 ? "neg" : "neu");
    const W = 150;
    const html = cells.map(([label, value, line]) => {
      const mid = W / 2;
      const w = Math.max(2, Math.abs(value) * mid * 1.6);
      const meter = `<svg viewBox="0 0 ${W} 8"><rect class="track" width="${W}" height="8" rx="1"/>`
        + `<rect class="${tone(value)}" x="${value >= 0 ? mid : mid - w}" width="${w}" height="8"/>`
        + `<line class="mid" x1="${mid}" x2="${mid}" y1="-3" y2="11"/></svg>`;
      const H = 40;
      const x = (i) => 4 + (i * (W - 8)) / 13;
      const y = (v) => H / 2 - (v / 0.5) * (H / 2 - 4);
      const ticks = line.map((_, i) => `<line class="tick" x1="${x(i)}" x2="${x(i)}" y1="${H / 2 - 3}" y2="${H / 2 + 3}"/>`).join("");
      const points = line.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const last = line[line.length - 1];
      const spark = `<svg viewBox="0 0 ${W} ${H}"><line class="zero" x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}"/>${ticks}`
        + `<polyline class="line" points="${points}"/>`
        + `<circle class="end ${tone(last)}" cx="${x(13)}" cy="${y(last)}" r="5.5"/></svg>`;
      return `<div class="cell"><b>${label}</b>${meter}${spark}</div>`;
    }).join("");
    document.getElementById("strip").innerHTML = html;
  </script>
</body>
</html>
