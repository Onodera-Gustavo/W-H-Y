name: pipeline

on:
  schedule:
    - cron: "0 9 * * *" # every day at 09:00 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill this many past days before the run (0 to 60, about 6 requests per day; 0 = no backfill)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

# one run at a time: the data branch has a single writer
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    # a 60 day backfill is about 360 requests 3 seconds apart, plus FinBERT on CPU
    timeout-minutes: 60
    permissions:
      contents: write # push raw data and history to the data branch
    env:
      # empty on scheduled runs; passed through env, never pasted into a script
      BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Check out the data branch into data/
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --no-tags --depth=1 origin data:data
            git worktree add data data
          else
            echo "No data branch yet, starting an orphan one"
            git worktree add --orphan -b data data
            printf '*.duckdb\n*.tmp\n' > data/.gitignore
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-finbert.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-prosusai-finbert-v1

      - name: Backfill past days
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*)
              echo "::error::backfill_days must be a whole number from 0 to 60, got '$BACKFILL_DAYS'"
              exit 1
              ;;
          esac
          if [ "$BACKFILL_DAYS" -gt 0 ]; then
            python -m why backfill --days "$BACKFILL_DAYS" --models vader,finbert
          else
            echo "backfill_days is 0: nothing to backfill"
          fi

      - name: Run the pipeline
        run: python -m why run --models vader,finbert

      - name: Compare VADER and FinBERT
        run: python -m why compare

      - name: Commit raw data and history to the data branch
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          message="data: pipeline run $(date -u +%Y-%m-%d)"
          if [ "$BACKFILL_DAYS" != "0" ]; then
            message="$message, backfill of $BACKFILL_DAYS days"
          fi
          git commit -m "$message"
          cd "$GITHUB_WORKSPACE"
          git push origin data

      - name: Build the site
        run: |
          # every page and asset of the frontend, next to the JSON exports in site/data
          cp -R frontend/. site/
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
